# Disposable, local integration services only. Never link this project remotely.
project_id = "shagun-integration"

[api]
enabled = true
port = 55321
schemas = ["public", "shagun"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 55323

[local_smtp]
enabled = false
port = 55324

[storage]
enabled = true
file_size_limit = "3MiB"

[auth]
enabled = true
site_url = "http://localhost:3200"
additional_redirect_urls = ["http://localhost:3200"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# Enable the email/password provider; the global auth.enable_signup=false above
# still rejects registration. The CLI maps this flag to EXTERNAL_EMAIL_ENABLED.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false